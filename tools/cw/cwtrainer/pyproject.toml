[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "cwtrainer"
version = "0.1.0"
description = "CW sending trainer for an iambic paddle"
requires-python = ">=3.12"
dependencies = ["numpy", "sounddevice", "evdev"]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
cwtrainer = "cwtrainer.main:main"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
